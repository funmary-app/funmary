packages:
  - apps/*
  - packages/public/*
  - packages/private/*

# 複数のパッケージで使う依存の版は、ここで 1 か所にまとめる。各 package.json では "catalog:" と書く
catalog:
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  '@eslint/js': ^10.0.1
  '@playwright/test': ^1.64.1
  '@sveltejs/adapter-node': ^6.0.0
  '@sveltejs/kit': ^3.1.0
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@types/node': ^24.19.0
  better-sqlite3: ^13.0.3
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.23.1
  fast-check: ^4.10.2
  globals: ^17.13.0
  hono: ^4.13.13
  ical.js: ^2.2.1
  lint-staged: ^17.6.0
  prettier: ^3.9.10
  prettier-plugin-svelte: ^4.1.1
  simple-git-hooks: ^2.14.0
  svelte: ^5.57.2
  svelte-check: ^4.7.7
  svelte-eslint-parser: ^1.9.0
  tsdown: ^0.23.1
  typescript-eslint: ^8.72.0
  valibot: ^1.5.0
  vite: ^8.3.1
  vitest: ^5.0.5

# 依存のインストール時スクリプトは、ここで許可したものだけを動かす
allowBuilds:
  # sass の監視用 (任意の依存)。テーマの変換では監視を使わないので、ネイティブのビルドは動かさない
  '@parcel/watcher': false
  # better-sqlite3 は各 OS 向けのビルド済みのファイルを同梱している。ソースからのビルド (node-gyp) は動かさない
  better-sqlite3: false
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.32.0'
  - hono-feed@1.2.0
