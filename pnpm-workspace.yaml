packages:
  - apps/*
  - packages/public/*
  - packages/private/*

# 複数のパッケージで使う依存の版は、ここで 1 か所にまとめる。各 package.json では "catalog:" と書く
catalog:
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  '@eslint/js': ^10.0.1
  '@playwright/test': ^1.65.1
  '@sveltejs/adapter-node': ^6.0.5
  '@sveltejs/kit': ^3.4.0
  '@sveltejs/vite-plugin-svelte': ^7.3.2
  '@types/node': ^24.19.2
  better-sqlite3: ^13.2.0
  eslint: ^10.15.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.24.1
  fast-check: ^4.11.0
  globals: ^17.14.0
  hono: ^4.13.21
  ical.js: ^2.2.1
  lint-staged: ^17.6.2
  prettier: ^3.10.1
  prettier-plugin-svelte: ^4.2.0
  simple-git-hooks: ^2.14.0
  svelte: ^5.59.1
  svelte-check: ^4.7.8
  svelte-eslint-parser: ^1.12.0
  tsdown: ^0.23.7
  typescript-eslint: ^8.74.0
  valibot: ^1.5.0
  vite: ^8.3.8
  vitest: ^5.1.1

# 依存のインストール時スクリプトは、ここで許可したものだけを動かす
allowBuilds:
  # sass の監視用 (任意の依存)。テーマの変換では監視を使わないので、ネイティブのビルドは動かさない
  '@parcel/watcher': false
  # better-sqlite3 は各 OS 向けのビルド済みのファイルを同梱している。ソースからのビルド (node-gyp) は動かさない
  better-sqlite3: false
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@mizchi/mutator'
  - '@mizchi/mutator-core'
  - '@mizchi/mutator-jest'
  - '@mizchi/mutator-playwright'
  - '@mizchi/mutator-typecheck'
  - '@mizchi/mutator-vitest'
  - migenv
