name: CI

# PR では、必須の検査をすべて動かす。main への push では、リリースの前に要るものだけを動かす
# (E2E は PR で通したものとする。Windows での単体テストは windows.yml で、main への push のときに別に動かす)。
# 文書だけの変更では、main の CI を動かさない。CI が動かなければ Release と Deploy も走らず、本番を再起動しない。
# PR では、文書だけの変更か、所有者かメンテナーが !ignore_ci と書いたときに、重い検査を飛ばす (skip ジョブが決める)
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read
  # skip ジョブが、PR の変更したファイルとコメントを読むため
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # main には必須の検査があるので、ワークフローごと止めると PR をマージできなくなる。ここで決め、重いジョブを if で飛ばす
  # (飛ばしたジョブは、必須の検査を満たす)。決められなければ skip は false になり、すべて動かす
  skip:
    name: CI を飛ばすかの判定
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          install: false
      - id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/workflows/ci/ci-skip.js

  check:
    name: 検査とビルド
    needs: skip
    # main への push では skip が動かない (飛ばしたことになる) ので、!cancelled() で待ってから動く
    if: ${{ !cancelled() && needs.skip.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # typescript-eslint と svelte-check は 6 系で動くので、7 系と判定が食い違っていないかを確かめる
      - run: pnpm typecheck:ts6
      - run: pnpm test
      # npm で配るクライアントの型は、サーバーの OpenAPI の定義から作る。作り直して差分が出たら、コミットし忘れ
      - name: クライアントの型の確認
        run: |
          pnpm generate:client
          git diff --exit-code -- packages/public/client/src/generated
      - run: pnpm build
      # VPS への反映のスクリプトは、実機でしか動かせないので、偽の systemctl と npm で動きを確かめる
      - name: 反映のスクリプトの検査
        run: |
          shellcheck deploy/update.sh deploy/funmary-update deploy/funmary-admin deploy/tests/deploy.test.sh
          bash deploy/tests/deploy.test.sh
      # 環境変数ファイルの空の値 (HOST= など) のままでも、本番と同じ入口で起動できるかを確かめる
      - name: リリースの起動の確認
        run: |
          pnpm package-release build-0000000
          node scripts/smoke-release.js build-0000000

  # 次の LTS の Node.js 26 でも動くかを確かめる (#421)。本番を 26 に上げて .nvmrc を変えるまでの間だけ置く。必須の検査にはしない
  node26:
    name: Node.js 26 での検査
    needs: skip
    if: ${{ !cancelled() && needs.skip.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: 26
      - run: pnpm test
      - run: pnpm build
      - name: リリースの起動の確認
        run: |
          pnpm package-release build-0000000
          node scripts/smoke-release.js build-0000000

  e2e:
    name: E2E テスト
    needs: skip
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.skip.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Playwright の版
        id: playwright
        run: echo "version=$(pnpm --filter @funmary/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # キャッシュは main の実行 (browser-cache) だけが書き、PR は読むだけにする。PR の変更が、ほかの PR や main の実行に
      # 渡るブラウザを差し替えられないようにするため。鍵に版を入れるので、Playwright を上げると取り直す
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # キャッシュがあれば、ブラウザの取得は飛ばされる。OS の依存 (--with-deps) は入れない。apt の取得が遅いと、
      # これだけで 10 分近くかかることがあり、GitHub の Ubuntu には Chrome とその依存が入っているため
      - run: pnpm --filter @funmary/web exec playwright install --only-shell chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # E2E が使うブラウザのキャッシュを、main の実行で用意する。キャッシュがあれば (Playwright の版が同じなら) 何もしない
  browser-cache:
    name: ブラウザのキャッシュ
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Playwright の版
        id: playwright
        run: echo "version=$(pnpm --filter @funmary/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm --filter @funmary/web exec playwright install --only-shell chromium
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

  secrets:
    name: 秘密情報の混入検査
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: false
      # gitleaks の GitHub Action は組織のリポジトリではライセンスキーが要るので、CLI を直接動かす
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose
      # 本番のドメインがコミットされていないかを調べる。探す文字列は secret に置き、ログでは伏せられる
      - name: 本番のドメインの混入検査
        env:
          PRODUCTION_DOMAIN: ${{ secrets.PRODUCTION_DOMAIN }}
        run: node scripts/workflows/ci/check-production-domain.js

  commitlint:
    name: コミットメッセージの検査
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # PR に含まれるコミットは、そのまま main の履歴に残る
      - name: PR のコミット
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      # merge commit のメッセージは PR のタイトルになるので、同じ決まりで検査する
      - name: PR のタイトル
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
