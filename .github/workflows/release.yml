name: Release

# main の CI が成功したら、その変更をリリースにして GitHub Releases に置く。
# CI が落ちた変更は、リリースも反映もされない。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: リリースの作成
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # リリースノートに、前回のリリースからの変更を書くために、履歴がすべて要る
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: tar.gz を作り、GitHub Releases に置く
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/workflows/release/publish-release.js
      # Deploy に、リリースにしたコミットを渡す。Deploy の head_sha は起動した時点の main の最新で、この版と違うことがある
      - run: node -e "require('node:fs').writeFileSync('released-sha', process.env.HEAD_SHA)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: released-sha
          path: released-sha
          retention-days: 7
